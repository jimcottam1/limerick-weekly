<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 061 - Local News for Limerick</title>
    <meta name="description" content="Local news from Limerick city and county, curated daily.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;700&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="paper">
        <header>
            <div class="edition-bar">
                <span id="edition">Vol. &mdash; No. &mdash;</span>
                <span>Limerick, Ireland</span>
                <span>Free Edition</span>
            </div>
            <div class="masthead">
                <div class="ear ear-left"><strong>Local first</strong>News from the Treaty City and county</div>
                <h1 class="masthead-title"><a href="./"><span class="mast-the">The</span>061</a></h1>
                <div class="ear ear-right"><strong>Updated daily</strong>New stories every morning at 6am</div>
            </div>
            <div class="dateline">
                <span id="editionDate">&nbsp;</span>
                <span class="motto">All the news of the Treaty City</span>
                <span id="storyCount">&nbsp;</span>
            </div>
        </header>

        <main id="front">
            <p class="notice">Setting the type&hellip;</p>
        </main>

        <section class="sources" id="sources"></section>

        <footer class="colophon">
            <span class="masthead-small"><span class="mast-the">The</span>061</span>
            AI-curated local news for Limerick
        </footer>
    </div>

    <script>
        // Escape text before putting it into innerHTML (article text comes from an AI rewrite of scraped pages)
        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function articleHref(article) {
            return `articles/${encodeURIComponent(article.slug)}.html`;
        }

        function shortDate(value) {
            const d = new Date(value);
            return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-IE', { day: 'numeric', month: 'short' });
        }

        function toRoman(n) {
            const map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
            let out = '';
            for (const [value, numeral] of map) {
                while (n >= value) { out += numeral; n -= value; }
            }
            return out;
        }

        // Edition details come from when the site was built, not when the page is viewed
        function setEdition(generatedAt, count) {
            const d = new Date(generatedAt);
            const when = Number.isNaN(d.getTime()) ? new Date() : d;
            const startOfYear = new Date(when.getFullYear(), 0, 0);
            const dayOfYear = Math.floor((when - startOfYear) / 86400000);
            document.getElementById('edition').textContent =
                `Vol. ${toRoman(Math.max(1, when.getFullYear() - 2024))} · No. ${dayOfYear}`;
            document.getElementById('editionDate').textContent =
                when.toLocaleDateString('en-IE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('storyCount').textContent = `${count} ${count === 1 ? 'story' : 'stories'}`;
        }

        // Photos are hot-linked from the source site; if one fails to load, drop the whole figure
        function photoHtml(article, className) {
            if (!article.imageUrl) return '';
            return `
                <figure class="photo ${className}">
                    <a href="${articleHref(article)}"><img src="${esc(article.imageUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('figure').remove()"></a>
                    <figcaption>${esc(article.photoCredit)}</figcaption>
                </figure>`;
        }

        // Link to the publisher's original story; plain text if the build had no usable link
        function sourceLink(article) {
            const name = esc(article.originalSource);
            return article.originalLink
                ? `<a class="source-link" href="${esc(article.originalLink)}" target="_blank" rel="noopener" title="Read the original story on ${name}">${name}</a>`
                : name;
        }

        function storyFoot(article) {
            return `
                <div class="story-foot">
                    <a class="continued" href="${articleHref(article)}">Read more &rarr;</a>
                    <span class="original">Original story: ${sourceLink(article)}</span>
                </div>`;
        }

        // Footer list of every publication in this edition, linked to its homepage
        function renderSources(articles) {
            const sources = new Map();
            for (const a of articles) {
                if (!sources.has(a.originalSource)) sources.set(a.originalSource, a.sourceHome);
            }
            const items = [...sources]
                .sort(([a], [b]) => a.localeCompare(b))
                .map(([name, home]) => home
                    ? `<li><a href="${esc(home)}" target="_blank" rel="noopener">${esc(name)}</a></li>`
                    : `<li>${esc(name)}</li>`)
                .join('');
            document.getElementById('sources').innerHTML = `
                <h2 class="sources-heading">Sources</h2>
                <ul class="sources-list">${items}</ul>
                <p class="sources-note">The 061 rewrites local reporting with AI. The original journalism belongs to these publishers. Every story links to its source, so please read and support them.</p>`;
        }

        function leadHtml(article, paragraphCount) {
            const paragraphs = (article.lead || [article.summary]).slice(0, paragraphCount).map(p => `<p>${esc(p)}</p>`).join('');
            return `
                <article class="lead">
                    <span class="kicker">${esc(article.section)}</span>
                    <h2 class="headline"><a href="${articleHref(article)}">${esc(article.headline)}</a></h2>
                    ${article.subheadline ? `<p class="deck">${esc(article.subheadline)}</p>` : ''}
                    <p class="byline">The 061 &middot; from reporting by ${sourceLink(article)} &middot; ${esc(shortDate(article.publishedAt))}</p>
                    ${photoHtml(article, 'photo-lead')}
                    ${article.pullQuote ? `<p class="pull-quote">${esc(article.pullQuote)}</p>` : ''}
                    <div class="body-text drop-cap">${paragraphs}</div>
                    <a class="continued" href="${articleHref(article)}">Continued inside &rarr;</a>
                </article>`;
        }

        // Only the top sidebar story gets a photo, so the sidebar doesn't outgrow the lead column
        function secondHtml(article, index) {
            return `
                <article class="second">
                    ${index === 0 ? photoHtml(article, 'photo-second') : ''}
                    <span class="kicker">${esc(article.section)}</span>
                    <h3 class="headline"><a href="${articleHref(article)}">${esc(article.headline)}</a></h3>
                    ${article.subheadline ? `<p class="deck">${esc(article.subheadline)}</p>` : ''}
                    <p class="summary">${esc(article.summary)}</p>
                    ${storyFoot(article)}
                </article>`;
        }

        function storyHtml(article) {
            return `
                <article class="story">
                    ${photoHtml(article, 'photo-story')}
                    <span class="kicker">${esc(article.section)}</span>
                    <h3 class="headline"><a href="${articleHref(article)}">${esc(article.headline)}</a></h3>
                    ${article.subheadline ? `<p class="deck">${esc(article.subheadline)}</p>` : ''}
                    <p class="summary">${esc(article.summary)}</p>
                    ${storyFoot(article)}
                </article>`;
        }

        function render(articles, sidebarCount, paragraphCount) {
            // Lead with the newest story that has a photo; the rest keep their order
            const leadIndex = Math.max(0, articles.findIndex(a => a.imageUrl));
            const lead = articles[leadIndex];
            const rest = articles.filter((_, i) => i !== leadIndex);
            const seconds = rest.slice(0, sidebarCount);
            // Stories without a photo go to the end of the grid so each row lines up
            const others = rest.slice(sidebarCount).sort((a, b) => !a.imageUrl - !b.imageUrl);

            let html = `<div class="front">${leadHtml(lead, paragraphCount)}`;
            if (seconds.length) {
                html += `<aside class="sidebar"><div class="sidebar-heading">Also in the news</div>${seconds.map(secondHtml).join('')}</aside>`;
            }
            html += '</div>';
            if (others.length) {
                html += `<hr class="section-rule"><div class="grid">${others.map(storyHtml).join('')}</div>`;
            }
            document.getElementById('front').innerHTML = html;
        }

        /** Height of an element's content, ignoring the stretched grid cell it sits in. */
        function contentHeight(el) {
            if (!el) return 0;
            const top = el.getBoundingClientRect().top;
            return Math.max(0, ...[...el.children].map(c => c.getBoundingClientRect().bottom - top));
        }

        // Fit the lead column and sidebar to roughly the same height: drop sidebar stories into
        // the grid while the sidebar is taller, then trim lead paragraphs while the lead is taller.
        // Photos have fixed aspect ratios, so heights are right before the images finish loading.
        const SLACK = 60;
        function layout(articles) {
            const maxParagraphs = Math.max(...articles.map(a => (a.lead || []).length), 1);
            let sidebarCount = 3;
            let paragraphCount = maxParagraphs;
            render(articles, sidebarCount, paragraphCount);

            // Stacked on narrow screens: nothing to balance
            if (window.matchMedia('(max-width: 900px)').matches) return;

            const heights = () => [contentHeight(document.querySelector('.lead')), contentHeight(document.querySelector('.sidebar'))];
            let [lead, side] = heights();
            while (side > lead + SLACK && sidebarCount > 1) {
                render(articles, --sidebarCount, paragraphCount);
                [lead, side] = heights();
            }
            while (lead > side + SLACK && paragraphCount > 1) {
                render(articles, sidebarCount, --paragraphCount);
                [lead, side] = heights();
            }
        }

        // Load the article list published by the daily build (relative path so it works under /the-061/)
        async function loadArticles() {
            const front = document.getElementById('front');
            try {
                const response = await fetch('data/articles.json', { cache: 'no-cache' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                const articles = data.articles || [];
                setEdition(data.generatedAt, articles.length);

                if (articles.length === 0) {
                    front.innerHTML = '<p class="notice">No stories in this edition yet. New stories are added every morning at 6am.</p>';
                    return;
                }

                layout(articles);
                renderSources(articles);
                // Web fonts change line heights, so balance again once they've loaded and on resize
                document.fonts?.ready.then(() => layout(articles));
                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => layout(articles), 200);
                });
            } catch (error) {
                console.error('Error loading articles:', error);
                front.innerHTML = `<p class="notice">The presses have stalled: ${esc(error.message)}. Please try refreshing the page.</p>`;
            }
        }

        loadArticles();
    </script>
</body>
</html>
