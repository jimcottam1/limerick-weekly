<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 061 - Local News for Limerick</title>
    <meta name="description" content="Local news from Limerick city and county, curated daily.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;700&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="paper">
        <header>
            <div class="edition-bar">
                <span id="edition">Vol. &mdash; No. &mdash;</span>
                <span>Limerick, Ireland</span>
                <span>Free Edition</span>
            </div>
            <div class="masthead">
                <div class="ear ear-left"><strong>Local first</strong>News from the Treaty City and county</div>
                <h1 class="masthead-title"><a href="./"><span class="mast-the">The</span>061</a></h1>
                <div class="ear ear-right"><strong>Updated daily</strong>New stories every morning at 6am</div>
            </div>
            <div class="dateline">
                <span id="editionDate">&nbsp;</span>
                <span class="motto">All the news of the Treaty City</span>
                <span id="storyCount">&nbsp;</span>
            </div>
            <div class="today-strip" id="today" aria-label="Limerick right now" hidden></div>
            <nav class="section-nav" id="sectionNav" aria-label="Sections"></nav>
        </header>

        <main id="front">
            <p class="notice">Setting the type&hellip;</p>
        </main>

        <section class="sources" id="sources"></section>

        <footer class="colophon">
            <span class="masthead-small"><span class="mast-the">The</span>061</span>
            AI-curated local news for Limerick
        </footer>
    </div>

    <script>
        // Escape text before putting it into innerHTML (article text comes from an AI rewrite of scraped pages)
        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function articleHref(article) {
            return `articles/${encodeURIComponent(article.slug)}.html`;
        }

        function shortDate(value) {
            const d = new Date(value);
            return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-IE', { day: 'numeric', month: 'short' });
        }

        // Calendar day in Irish time, so "Today" flips at midnight in Limerick rather than UTC
        function irishDay(date) {
            return date.toLocaleDateString('en-CA', { timeZone: 'Europe/Dublin' });
        }

        /** "Today", "Yesterday", the weekday within the last week, otherwise the date. */
        function whenLabel(value) {
            const d = new Date(value);
            if (Number.isNaN(d.getTime())) return '';
            const days = Math.round((new Date(irishDay(new Date())) - new Date(irishDay(d))) / 86400000);
            if (days <= 0) return 'Today';
            if (days === 1) return 'Yesterday';
            if (days < 7) return d.toLocaleDateString('en-IE', { weekday: 'long', timeZone: 'Europe/Dublin' });
            return shortDate(value);
        }

        function whenHtml(article) {
            const label = whenLabel(article.publishedAt);
            return label ? `<span class="when${label === 'Today' ? ' today' : ''}">${esc(label)}</span>` : '';
        }

        function toRoman(n) {
            const map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
            let out = '';
            for (const [value, numeral] of map) {
                while (n >= value) { out += numeral; n -= value; }
            }
            return out;
        }

        // Edition details come from when the site was built, not when the page is viewed
        function setEdition(generatedAt, count) {
            const d = new Date(generatedAt);
            const when = Number.isNaN(d.getTime()) ? new Date() : d;
            const startOfYear = new Date(when.getFullYear(), 0, 0);
            const dayOfYear = Math.floor((when - startOfYear) / 86400000);
            document.getElementById('edition').textContent =
                `Vol. ${toRoman(Math.max(1, when.getFullYear() - 2024))} · No. ${dayOfYear}`;
            document.getElementById('editionDate').textContent =
                when.toLocaleDateString('en-IE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('storyCount').textContent = `${count} ${count === 1 ? 'story' : 'stories'}`;
        }

        // Photos are hot-linked from the source site; if one fails to load, drop the whole figure
        function photoHtml(article, className) {
            if (!article.imageUrl) return '';
            return `
                <figure class="photo ${className}">
                    <a href="${articleHref(article)}"><img src="${esc(article.imageUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('figure').remove()"></a>
                    <figcaption>${esc(article.photoCredit)}</figcaption>
                </figure>`;
        }

        // Link to the publisher's original story; plain text if the build had no usable link
        function sourceLink(article) {
            const name = esc(article.originalSource);
            return article.originalLink
                ? `<a class="source-link" href="${esc(article.originalLink)}" target="_blank" rel="noopener" title="Read the original story on ${name}">${name}</a>`
                : name;
        }

        function shareButton(article) {
            return `<button type="button" class="share-mini" data-share="${esc(articleHref(article))}" data-title="${esc(article.headline)}">Share</button>`;
        }

        function storyFoot(article) {
            return `
                <div class="story-foot">
                    <span><a class="continued" href="${articleHref(article)}">Read more &rarr;</a>${shareButton(article)}</span>
                    <span class="original">Original story: ${sourceLink(article)}</span>
                </div>`;
        }

        // Share: the phone's own share menu where there is one; otherwise copy the story's link
        document.addEventListener('click', e => {
            const btn = e.target.closest('[data-share]');
            if (!btn) return;
            const url = new URL(btn.dataset.share, location.href).href;
            const done = text => { btn.textContent = text; setTimeout(() => { btn.textContent = 'Share'; }, 2000); };
            if (navigator.share) {
                navigator.share({ title: btn.dataset.title, url }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => done('Link copied'), () => done('Copy failed'));
            }
        });

        // Footer list of every publication in this edition, linked to its homepage
        // Animated promo banners for the papers we draw on, built from their own logos (public/promos).
        // Always shown, even in a week when one of them has no story on the front page.
        const PROMOS = [
            { name: 'Limerick Leader', home: 'https://www.limerickleader.ie/', file: 'limerick-leader' },
            { name: 'Limerick Post', home: 'https://www.limerickpost.ie/', file: 'limerick-post' },
            { name: 'Limerick Voice', home: 'https://limerickvoice.com/', file: 'limerick-voice' },
            { name: 'Limerick GAA', home: 'https://www.limerickgaa.ie/', file: 'limerick-gaa' },
            { name: 'Limerick Chamber', home: 'https://www.limerickchamber.ie/', file: 'limerick-chamber' }
        ];

        // ---------- Limerick GAA club results and fixtures (Sport section) ----------

        let gaa = null;

        /** "Blackrock 1-20 Belville Gaels 1-14" -> both sides, with the winner in bold. */
        function resultHtml(line) {
            const m = line.match(/^(.*?)\s+(\d+)-(\d+)\s+(.*?)\s+(\d+)-(\d+)$/);
            if (!m) return esc(line);
            const [, a, ag, ap, b, bg, bp] = m;
            const total = (g, p) => Number(g) * 3 + Number(p);
            const diff = total(ag, ap) - total(bg, bp);
            const side = (team, g, p, won) => `<span class="${won ? 'won' : ''}">${esc(team)} <span class="score">${g}-${p}</span></span>`;
            return `${side(a, ag, ap, diff > 0)} <span class="muted">·</span> ${side(b, bg, bp, diff < 0)}`;
        }

        /** "Patrickswell v Athea in Mick Neville Park at 6.45pm" -> teams, then venue and time. */
        function fixtureHtml(line) {
            const m = line.match(/^(.*?)\s+in\s+(.*?)(?:\s+at\s+(.+))?$/i);
            if (!m) return esc(line);
            return `${esc(m[1])}<span class="where">${esc(m[2])}${m[3] ? ` · ${esc(m[3])}` : ''}</span>`;
        }

        function fixturePost(post, format) {
            return `
                <div class="fx-post">
                    <div class="fx-day">${esc(post.day)}</div>
                    ${post.competitions.map(c => `
                        <div class="fx-comp">${esc(c.name)}</div>
                        <ul>${c.matches.map(m => `<li>${format(m)}</li>`).join('')}</ul>`).join('')}
                    <a class="source-link" href="${esc(post.link)}" target="_blank" rel="noopener">Limerick GAA</a>
                </div>`;
        }

        function fixturesHtml() {
            if (!gaa || (!gaa.results?.length && !gaa.fixtures?.length)) return '';
            const column = (title, posts, format, empty) => `
                <div class="fx-col">
                    <h3 class="fx-title">${title}</h3>
                    ${posts?.length ? posts.map(p => fixturePost(p, format)).join('') : `<p class="muted">${empty}</p>`}
                </div>`;
            return `
                <section class="fixtures" aria-label="Limerick GAA club results and fixtures">
                    ${column('Club results', gaa.results, resultHtml, 'No results this week yet.')}
                    ${column('Coming up', gaa.fixtures, fixtureHtml, 'No fixtures posted in the last few days.')}
                </section>`;
        }

        // ---------- "Limerick today" strip, from Ireland Now's live data (same site, so no keys) ----------

        async function renderToday() {
            const base = '/ireland-now/data/';
            const get = name => fetch(`${base}${name}.json`, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null);
            const [warnings, weather, rivers, water, buses] = await Promise.all(['warnings', 'weather', 'rivers', 'water', 'buses'].map(get));
            const parts = [];

            const w = weather?.counties?.limerick;
            if (w) parts.push(`<strong>${Math.round(w.temperature)}°C</strong> ${esc(w.description.toLowerCase())}, ${Math.round(w.todayMin)}–${Math.round(w.todayMax)}° today`);

            if (warnings) {
                const here = (warnings.warnings || []).filter(x => x.counties.includes('limerick'));
                const top = ['red', 'orange', 'yellow'].find(l => here.some(x => x.level === l));
                parts.push(top
                    ? `<span class="warn ${top}">${esc(top[0].toUpperCase() + top.slice(1))} ${esc(here.find(x => x.level === top).type.toLowerCase())} warning</span>`
                    : 'No weather warnings');
            }

            if (rivers) {
                const gauges = rivers.stations.filter(s => s.county === 'limerick' && s.trend !== 'unknown');
                const rising = gauges.filter(s => s.trend.startsWith('rising')).length;
                if (gauges.length) parts.push(rising ? `<strong>${rising}</strong> river gauge${rising === 1 ? '' : 's'} rising` : 'Rivers steady');
            }

            if (water) {
                const active = (water.notices || []).filter(n => n.county === 'limerick' && n.active).length;
                parts.push(active ? `<strong>${active}</strong> water notice${active === 1 ? '' : 's'}` : 'No water notices');
            }

            if (buses) {
                const here = (buses.buses || []).filter(b => b.county === 'limerick');
                const late = here.filter(b => b.minutesLate >= 5).length;
                if (here.length) parts.push(`<strong>${here.length}</strong> buses running${late ? `, ${late} late` : ''}`);
            }

            if (!parts.length) return; // Ireland Now unavailable: leave the strip hidden
            const el = document.getElementById('today');
            el.innerHTML = `<span class="today-label">Limerick now</span>${parts.map(p => `<span class="today-item">${p}</span>`).join('')}
                <a class="today-more" href="/ireland-now/#county=limerick&show=water,buses">Live map &rarr;</a>`;
            el.hidden = false;
        }

        function renderSources(articles) {
            const promos = PROMOS.map(p => `
                <li>
                    <a class="promo" href="${p.home}" target="_blank" rel="noopener" title="Visit ${p.name}">
                        <picture>
                            <source srcset="promos/${p.file}.png" media="(prefers-reduced-motion: reduce)">
                            <img src="promos/${p.file}.gif" alt="${p.name}" width="480" height="240" loading="lazy">
                        </picture>
                    </a>
                </li>`).join('');

            // Any other source in this edition (e.g. a newly added feed) gets a plain link
            const others = new Map();
            for (const a of articles) {
                if (!PROMOS.some(p => p.name === a.originalSource) && !others.has(a.originalSource)) {
                    others.set(a.originalSource, a.sourceHome);
                }
            }
            const otherLinks = [...others].map(([name, home]) => home
                ? `<li><a href="${esc(home)}" target="_blank" rel="noopener">${esc(name)}</a></li>`
                : `<li>${esc(name)}</li>`).join('');

            document.getElementById('sources').innerHTML = `
                <h2 class="sources-heading">Our sources</h2>
                <ul class="promo-list">${promos}</ul>
                ${otherLinks ? `<ul class="sources-list">${otherLinks}</ul>` : ''}
                <p class="sources-note">The 061 rewrites local reporting with AI. The original journalism belongs to these publishers. Every story links to its source, so please read and support them.</p>`;
        }

        function leadHtml(article, paragraphCount) {
            const paragraphs = (article.lead || [article.summary]).slice(0, paragraphCount).map(p => `<p>${esc(p)}</p>`).join('');
            return `
                <article class="lead">
                    ${kicker(article, null)}
                    <h2 class="headline"><a href="${articleHref(article)}">${esc(article.headline)}</a></h2>
                    <p class="tldr">${esc(article.summary)}</p>
                    <p class="byline">The 061 &middot; from reporting by ${sourceLink(article)} &middot; ${esc(shortDate(article.publishedAt))}</p>
                    ${photoHtml(article, 'photo-lead')}
                    <div class="body-text drop-cap">${paragraphs}</div>
                    <a class="continued" href="${articleHref(article)}">Continued inside &rarr;</a>${shareButton(article)}
                </article>`;
        }

        // Only the top sidebar story gets a photo, so the sidebar doesn't outgrow the lead column
        function secondHtml(article, index) {
            return `
                <article class="second">
                    ${index === 0 ? photoHtml(article, 'photo-second') : ''}
                    ${kicker(article, null)}
                    <h3 class="headline"><a href="${articleHref(article)}">${esc(article.headline)}</a></h3>
                    <p class="summary">${esc(article.summary)}</p>
                    ${storyFoot(article)}
                </article>`;
        }

        function storyHtml(article, sectionName) {
            return `
                <article class="story">
                    ${photoHtml(article, 'photo-story')}
                    ${kicker(article, sectionName)}
                    <h3 class="headline"><a href="${articleHref(article)}">${esc(article.headline)}</a></h3>
                    <p class="summary">${esc(article.summary)}</p>
                    ${storyFoot(article)}
                </article>`;
        }

        // ---------- Sections ----------

        // Running order of the paper; sections with fewer stories than this fold into News
        const SECTION_ORDER = ['News', 'Sport', 'Council', 'Business', 'Arts & Culture', 'Courts'];
        const MIN_SECTION_SIZE = 2;
        const SECTION_LIST_SIZE = 2;
        // Most stories a section shows on the front page; older ones are in its archive page
        const SECTION_CAP = 7;

        function sectionId(name) {
            return name.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        }

        /** Group stories into sections in running order, folding very small sections into News. */
        function groupSections(articles) {
            const groups = new Map();
            for (const article of articles) {
                const name = SECTION_ORDER.includes(article.section) ? article.section : 'News';
                if (!groups.has(name)) groups.set(name, []);
                groups.get(name).push(article);
            }
            for (const [name, stories] of groups) {
                if (name !== 'News' && stories.length < MIN_SECTION_SIZE) {
                    if (!groups.has('News')) groups.set('News', []);
                    groups.get('News').push(...stories);
                    groups.delete(name);
                }
            }
            return SECTION_ORDER.filter(name => groups.has(name)).map(name => ({ name, stories: groups.get(name) }));
        }

        // Inside a section the kicker is only worth showing for stories folded in from another section
        // Section label (unless it's the section the story sits in) and how old the story is
        function kicker(article, sectionName) {
            const label = article.section !== sectionName ? `<span class="kicker">${esc(article.section)}</span>` : '';
            return `<div class="meta-line">${label}${whenHtml(article)}</div>`;
        }

        function sectionLeadHtml(article, sectionName) {
            return `
                <article class="section-lead${article.imageUrl ? '' : ' no-photo'}">
                    ${photoHtml(article, 'photo-section')}
                    <div class="section-lead-text">
                        ${kicker(article, sectionName)}
                        <h3 class="headline"><a href="${articleHref(article)}">${esc(article.headline)}</a></h3>
                        <p class="summary">${esc(article.summary)}</p>
                        ${storyFoot(article)}
                    </div>
                </article>`;
        }

        function briefHtml(article, sectionName) {
            return `
                <article class="brief">
                    ${kicker(article, sectionName)}
                    <h4 class="headline"><a href="${articleHref(article)}">${esc(article.headline)}</a></h4>
                    <p class="brief-summary">${esc(article.summary)}</p>
                    ${storyFoot(article)}
                </article>`;
        }

        // Full rows of three, then a last row that fills the width: two half-width stories,
        // or a single story laid out across the page with its photo beside the text
        function moreHtml(stories, sectionName) {
            const fullRows = stories.length - (stories.length % 3);
            const grid = stories.slice(0, fullRows);
            const tail = stories.slice(fullRows);
            let html = grid.length ? `<div class="grid">${grid.map(a => storyHtml(a, sectionName)).join('')}</div>` : '';
            if (tail.length === 2) {
                html += `<div class="grid cols-2">${tail.map(a => storyHtml(a, sectionName)).join('')}</div>`;
            } else if (tail.length === 1) {
                html += `<div class="tail-single">${sectionLeadHtml(tail[0], sectionName).replace('class="section-lead', 'class="section-lead wide')}</div>`;
            }
            return html;
        }

        function sectionHtml({ name, stories: all }) {
            // Stories arrive newest first; keep the newest few and leave the rest to the archive
            const stories = all.slice(0, SECTION_CAP);
            const held = all.length - stories.length;
            // Feature the section's newest story with a photo; photo-less stories go last in the grid
            const leadIndex = Math.max(0, stories.findIndex(a => a.imageUrl));
            const lead = stories[leadIndex];
            const rest = stories.filter((_, i) => i !== leadIndex);
            const briefs = rest.slice(0, SECTION_LIST_SIZE);
            const more = rest.slice(SECTION_LIST_SIZE).sort((a, b) => !a.imageUrl - !b.imageUrl);

            return `
                <section class="paper-section" id="${sectionId(name)}">
                    <header class="section-head">
                        <h2>${esc(name)}</h2>
                        <a class="more-link" href="sections/${sectionId(name)}.html">${held ? `${held} more this week &middot; ` : ''}More ${esc(name)} &rarr;</a>
                    </header>
                    <div class="section-top${briefs.length ? '' : ' solo'}">
                        ${sectionLeadHtml(lead, name)}
                        ${briefs.length ? `<div class="briefs">${briefs.map(a => briefHtml(a, name)).join('')}</div>` : ''}
                    </div>
                    ${name === 'Sport' ? fixturesHtml() : ''}
                    ${moreHtml(more, name)}
                </section>`;
        }

        // ---------- Stars (daily horoscope) ----------

        let stars = null;

        function starsHtml() {
            if (!stars?.signs?.length) return '';
            const day = new Date(`${stars.date}T12:00:00`).toLocaleDateString('en-IE', { weekday: 'long', day: 'numeric', month: 'long' });
            return `
                <section class="paper-section stars" id="stars">
                    <header class="section-head">
                        <h2>Stars</h2>
                        <span>${esc(day)}</span>
                    </header>
                    <div class="stars-grid">
                        ${stars.signs.map(s => `
                            <article class="star" id="stars-${esc(s.id)}">
                                <div class="star-head"><span class="star-symbol" aria-hidden="true">${esc(s.symbol)}&#xFE0E;</span>
                                    <div><h3>${esc(s.name)}</h3><span class="star-dates">${esc(s.dates)}</span></div></div>
                                <p>${esc(s.reading)}</p>
                            </article>`).join('')}
                    </div>
                    <p class="stars-note">Written each morning by AI, just for fun.</p>
                </section>`;
        }

        function renderSectionNav(sections) {
            const links = [`<a href="#top">Front Page</a>`]
                .concat(sections.map(s => `<a href="#${sectionId(s.name)}">${esc(s.name)}</a>`))
                .concat(stars?.signs?.length ? [`<a href="#stars">Stars</a>`] : [])
                .concat(`<a href="sections/all.html">Archive</a>`);
            document.getElementById('sectionNav').innerHTML = links.join('');
        }

        // ---------- Choosing the lead and Top stories ----------

        // Gemini rates each story 1-5 for importance and for positivity. Importance counts most;
        // each step of positivity above or below neutral (3) adds or takes off half a point.
        const POSITIVITY_WEIGHT = 0.5;
        const TOP_STORIES = 3;

        const published = a => new Date(a.publishedAt).getTime() || 0;
        const score = a => (a.importance || 3) + POSITIVITY_WEIGHT * ((a.positivity || 3) - 3);
        const byScore = (a, b) => score(b) - score(a) || published(b) - published(a);
        const within = (list, hours) => list.filter(a => Date.now() - published(a) <= hours * 3600000);

        /** Pool from the shortest time window that has enough stories in it. */
        function recentPool(list, windows, minimum) {
            for (const hours of windows) {
                const pool = within(list, hours);
                if (pool.length >= minimum) return pool;
            }
            return list;
        }

        /**
         * Lead: the best-scoring story with a photo from the last day (or two, or the week).
         * Top stories: the best of the last two days, at most one per section so one busy desk can't
         * fill the top of the paper, and always including any major (importance 5) story from today.
         */
        function chooseFront(articles) {
            const withPhoto = articles.filter(a => a.imageUrl);
            const lead = [...recentPool(withPhoto.length ? withPhoto : articles, [24, 48, 24 * 7], 1)].sort(byScore)[0];
            const others = articles.filter(a => a !== lead);
            const pool = [...recentPool(others, [48, 24 * 7], TOP_STORIES)].sort(byScore);

            const chosen = [];
            const sectionsUsed = new Set([lead.section]);
            const take = a => { chosen.push(a); sectionsUsed.add(a.section); };
            within(pool, 24).filter(a => a.importance === 5).forEach(take);
            for (const a of pool) {
                if (chosen.length >= TOP_STORIES) break;
                if (!chosen.includes(a) && !sectionsUsed.has(a.section)) take(a);
            }
            // Not enough different sections in the window: fill with the next best regardless
            for (const a of pool) {
                if (chosen.length >= TOP_STORIES) break;
                if (!chosen.includes(a)) take(a);
            }
            return { lead, top: chosen.sort(byScore) };
        }

        function render(articles, sidebarCount, paragraphCount) {
            const { lead, top } = chooseFront(articles);
            const seconds = top.slice(0, sidebarCount);
            // Everything else goes to the sections, newest first (including any Top story the sidebar had no room for)
            const sections = groupSections(articles.filter(a => a !== lead && !seconds.includes(a)));

            let html = `<div class="front" id="top">${leadHtml(lead, paragraphCount)}`;
            if (seconds.length) {
                html += `<aside class="sidebar"><div class="sidebar-heading">Top stories</div>${seconds.map(secondHtml).join('')}</aside>`;
            }
            html += '</div>';
            html += sections.map(sectionHtml).join('');
            html += starsHtml();
            document.getElementById('front').innerHTML = html;
            renderSectionNav(sections);
        }

        /** Height of an element's content, ignoring the stretched grid cell it sits in. */
        function contentHeight(el) {
            if (!el) return 0;
            const top = el.getBoundingClientRect().top;
            return Math.max(0, ...[...el.children].map(c => c.getBoundingClientRect().bottom - top));
        }

        // Fit the lead column and sidebar to roughly the same height: drop sidebar stories into
        // the grid while the sidebar is taller, then trim lead paragraphs while the lead is taller.
        // Photos have fixed aspect ratios, so heights are right before the images finish loading.
        const SLACK = 60;
        function layout(articles) {
            const maxParagraphs = Math.max(...articles.map(a => (a.lead || []).length), 1);
            let sidebarCount = 3;
            let paragraphCount = maxParagraphs;
            render(articles, sidebarCount, paragraphCount);

            // Stacked on narrow screens: nothing to balance
            if (window.matchMedia('(max-width: 900px)').matches) return;

            const heights = () => [contentHeight(document.querySelector('.lead')), contentHeight(document.querySelector('.sidebar'))];
            let [lead, side] = heights();
            while (side > lead + SLACK && sidebarCount > 1) {
                render(articles, --sidebarCount, paragraphCount);
                [lead, side] = heights();
            }
            while (lead > side + SLACK && paragraphCount > 1) {
                render(articles, sidebarCount, --paragraphCount);
                [lead, side] = heights();
            }
        }

        // Load the article list published by the daily build (relative path so it works under /the-061/)
        async function loadArticles() {
            const front = document.getElementById('front');
            try {
                const response = await fetch('data/articles.json', { cache: 'no-cache' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                // Optional: the GAA box just doesn't appear if this is missing
                gaa = await fetch('data/gaa-fixtures.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null);
                stars = await fetch('data/horoscope.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null);
                // Newest first by the original publication date (undated stories last)
                const time = a => new Date(a.publishedAt).getTime() || 0;
                const articles = (data.articles || []).slice().sort((a, b) => time(b) - time(a));
                setEdition(data.generatedAt, articles.length);

                if (articles.length === 0) {
                    front.innerHTML = '<p class="notice">No stories in this edition yet. New stories are added every morning at 6am.</p>';
                    return;
                }

                layout(articles);
                renderSources(articles);
                renderToday();
                // Sections are drawn after load, so the browser can't jump to a #section link by itself
                const jumpToHash = () => document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
                if (location.hash) jumpToHash();
                // Web fonts change line heights, so balance again once they've loaded and on resize
                document.fonts?.ready.then(() => {
                    layout(articles);
                    if (location.hash) jumpToHash();
                });
                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => layout(articles), 200);
                });
            } catch (error) {
                console.error('Error loading articles:', error);
                front.innerHTML = `<p class="notice">The presses have stalled: ${esc(error.message)}. Please try refreshing the page.</p>`;
            }
        }

        loadArticles();
    </script>
</body>
</html>
